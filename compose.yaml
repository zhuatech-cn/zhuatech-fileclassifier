services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zhuatech_demo}
    volumes: ["./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  api:
    build: ./backend
    environment:
      ZHUATECH_PRACTICAL_TOKEN: ${ZHUATECH_PRACTICAL_TOKEN:-}
      ZHUATECH_LLM_PROVIDER: ${ZHUATECH_LLM_PROVIDER:-local}
      ZHUATECH_LLM_BASE_URL: ${ZHUATECH_LLM_BASE_URL:-https://api.deepseek.com}
      ZHUATECH_LLM_MODEL: ${ZHUATECH_LLM_MODEL:-deepseek-chat}
      ZHUATECH_LLM_API_KEY: ${ZHUATECH_LLM_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "if command -v nc >/dev/null 2>&1; then nc -z 127.0.0.1 8080; else bash -c '</dev/tcp/127.0.0.1/8080'; fi"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
  web:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro", "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8088:80"]
    depends_on:
      api:
        condition: service_healthy
